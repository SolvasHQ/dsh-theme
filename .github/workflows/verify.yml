name: verify

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a newer push cancels an older in-flight verification.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rebuild the committed client artifact
        run: node build/build-client.mjs

      - name: Fail when client.js is stale
        run: git diff --exit-code -- client.js

      - name: Syntax check
        run: node --check client.js && node --check index.js

      - name: Manifest, locale, icon checks
        run: node tools/check-manifest.mjs

      - name: Discover market index checks
        run: node tools/check-market.mjs

      - name: Token and contrast checks
        run: node tools/verify-tokens.mjs

      - name: Panel functional checks
        run: node tools/check-panel.mjs
